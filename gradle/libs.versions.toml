[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
activity = "1.13.0"
core = "1.19.1"
timber = "5.0.1"
coroutines = "1.11.0"
junit = "4.13.2"
truth = "1.4.5"
robolectric = "4.17"
androidxTest = "1.7.0"
androidxJunit = "1.3.0"
androidxRunner = "1.7.0"
espresso = "3.7.0"
spotless = "8.10.3"
composeLints = "1.6.0"

[libraries]
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
composeUiTooling = { module = "androidx.compose.ui:ui-tooling" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeIcons = { module = "androidx.compose.material:material-icons-extended" }
composeUiTest = { module = "androidx.compose.ui:ui-test-junit4" }
composeUiTestManifest = { module = "androidx.compose.ui:ui-test-manifest" }
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
coreKtx = { module = "androidx.core:core-ktx", version.ref = "core" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidxTestCore = { module = "androidx.test:core", version.ref = "androidxTest" }
androidxJunit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidxRunner = { module = "androidx.test:runner", version.ref = "androidxRunner" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
composeLints = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "composeLints" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
