name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Run library unit tests
        run: ./gradlew :logviewer:testDebugUnitTest

      - name: Lint library and sample variants
        run: ./gradlew :logviewer:lintDebug :logviewer:lintRelease :sample:lintDebug :sample:lintRelease

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            logviewer/build/reports/lint-results-*.html
            logviewer/build/reports/lint-results-*.xml
            sample/build/reports/lint-results-*.html
            sample/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Build sample variants
        run: ./gradlew :sample:assembleDebug :sample:assembleRelease
