name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Run library unit tests
        run: ./gradlew :logviewer:testDebugUnitTest

      - name: Run sample unit tests
        run: ./gradlew :sample:test

      - name: Lint library and sample variants
        run: ./gradlew :logviewer:lintDebug :logviewer:lintRelease :sample:lintDebug :sample:lintRelease :sample:lintR8

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            logviewer/build/reports/lint-results-*.html
            logviewer/build/reports/lint-results-*.xml
            sample/build/reports/lint-results-*.html
            sample/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Build sample variants
        run: ./gradlew :sample:assembleDebug :sample:assembleRelease :sample:assembleR8 :r8test:assembleR8 :sample:analyzeR8R8Config

      - name: Upload R8 analysis reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-reports
          path: sample/build/reports/r8/
          if-no-files-found: warn
          retention-days: 7
