name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag in the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The tagged commit must be on main" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Verify tag matches library version
        run: |
          library_version="$(./gradlew -q :logviewer:properties --property version | sed -n 's/^version: //p')"
          if [[ "$library_version" != "$RELEASE_VERSION" ]]; then
            echo "Tag version $RELEASE_VERSION does not match library version $library_version" >&2
            exit 1
          fi

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Run library unit tests
        run: ./gradlew :logviewer:testDebugUnitTest

      - name: Run sample unit tests
        run: ./gradlew :sample:test

      - name: Lint library and sample variants
        run: ./gradlew :logviewer:lintDebug :logviewer:lintRelease :sample:lintDebug :sample:lintRelease

      - name: Build sample variants
        run: ./gradlew :sample:assembleDebug :sample:assembleRelease

      - name: Verify the sample release excludes the viewer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path("sample/build/outputs/apk/release/sample-release-unsigned.apk")
          markers = (
              b"Lcom/pedronveloso/logviewer/LogViewer;",
              b"Lcom/pedronveloso/logviewer/TimberLogCapture;",
              b"com.pedronveloso.logviewer.LogViewerFileProvider",
              b"pnv_logviewer_paths",
          )
          with ZipFile(apk) as archive:
              for name in archive.namelist():
                  if "pnv_logviewer" in name.lower():
                      raise SystemExit(f"Viewer content found in release APK: {name}")
                  content = archive.read(name)
                  if any(marker in content for marker in markers):
                      raise SystemExit(f"Viewer content found in release APK: {name}")
          PY

      - name: Publish automatically to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?Missing MAVEN_CENTRAL_USERNAME secret}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?Missing MAVEN_CENTRAL_PASSWORD secret}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?Missing SIGNING_IN_MEMORY_KEY secret}"
          ./gradlew -PmavenCentralDeploymentValidation=PUBLISHED :logviewer:publishAndReleaseToMavenCentral
